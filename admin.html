<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>
:root{--bg:#08090d;--card:#12131a;--ink:#f3eef0;--mute:#a49fa8;--acc:#ed2444;--line:#ffffff24}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif;overflow-x:hidden}
.w{max-width:900px;margin:auto;padding:28px 5vw 80px}h1{font:900 clamp(34px,7vw,56px)/1 Impact,sans-serif;text-align:center;letter-spacing:1px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:20px 0 26px}.tabs button,.b{padding:10px 18px;border:1px solid var(--line);background:#ffffff0d;color:var(--ink);cursor:pointer;font:inherit;border-radius:6px}
.tabs button.on,.b.p{background:var(--acc);border-color:var(--acc)}.b.sm{padding:5px 12px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:14px 0 4px}
input,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);background:#0b0c11;color:var(--ink);font:inherit;border-radius:6px}textarea{min-height:100px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}.msg{color:#7ee0a5;font-size:14px}.hint{color:var(--mute);font-size:13px}
.it{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}.it img,.ph{width:56px;height:72px;object-fit:cover;background:#ffffff14;border-radius:4px}.it b{flex:1;min-width:140px}
.login{max-width:360px;margin:18vh auto;text-align:center;padding:0 20px}.login input{margin:12px 0}a{color:#ff7b8f}
</style></head><body><div id="app"></div>
<script src="portfolio.config.js"></script>
<script>
const P=window.PORTFOLIO;let tok=sessionStorage.getItem('t')||'',C={},items=[],tab='profile',msg='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const set=t=>{const e=$('#st');if(e)e.textContent=t};
async function api(p,o={}){const r=await fetch('/api/'+p,{...o,headers:{authorization:'Bearer '+tok,...(o.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&p!=='login'){tok='';sessionStorage.removeItem('t');view()}throw new Error(j.error||'Error')}return j}
async function load(){const j=await (await fetch('/api/data')).json();C=j.content||{};items=j.items||[]}
const save=()=>api('save',{method:'POST',body:JSON.stringify({content:C,items})});
const def={location:P.location,role:P.role,intro:P.intro,about:P.about,skills:P.skills.join(', '),email:P.email,instagram:'',linkedin:'',whatsapp:'',education:P.education.map(e=>[e.school,e.degree,e.period].join(' | ')).join('\n'),services:P.services.map(s=>s.title+' | '+s.detail).join('\n')};
const v=k=>C[k]!==undefined?C[k]:def[k]||'';
const inp=(k,l,ta,ph)=>`<label>${l}</label>${ta?`<textarea id="f_${k}" placeholder="${ph||''}">${esc(v(k))}</textarea>`:`<input id="f_${k}" value="${esc(v(k))}" placeholder="${ph||''}">`}`;
function view(){
 if(!tok){$('#app').innerHTML=`<div class="login"><h1>ADMIN</h1><p class="hint" style="margin-top:10px">Please log in</p><input id="id" placeholder="Admin ID" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="b p" onclick="login()">Enter</button><p class="msg" style="color:#ff7b8f">${esc(msg)}</p><p class="hint" style="margin-top:20px"><a href="/">← View website</a></p></div>`;return}
 const tabs=[['profile','Profile & Contact'],['collections','Collections'],['more','Education & Services']];let b='';
 if(tab==='profile')b=`<div class="panel">${inp('role','Role')}${inp('location','Location')}${inp('intro','Short introduction',1)}${inp('about','About me',1)}${inp('skills','Skills (separate with commas)',1)}${inp('email','Public email (optional)')}${inp('instagram','Instagram link (optional)','','https://instagram.com/...')}${inp('linkedin','LinkedIn link (optional)')}${inp('whatsapp','WhatsApp number with country code (optional)','','91xxxxxxxxxx')}<label>Portrait photo (JPG or PNG)</label><input id="portrait" type="file" accept="image/*"><p class="hint">${C.portraitId?'A portrait is saved. Choose a new file to replace it.':'No portrait yet. Choose a file, then save.'}</p><label>Resume PDF (optional, up to 5 MB)</label><input id="resume" type="file" accept="application/pdf"><div class="row"><button class="b p" onclick="saveProfile()">Save changes</button><span class="msg" id="st">${esc(msg)}</span></div></div>`;
 else if(tab==='more')b=`<div class="panel">${inp('education','Education (one per line: School | Qualification | Year)',1,'Your college | B.Voc Fashion Design | 2026')}${inp('services','Services (one per line: Title | Short detail)',1)}<div class="row"><button class="b p" onclick="saveMore()">Save changes</button><span class="msg" id="st">${esc(msg)}</span></div></div>`;
 else b=`<div class="panel"><h2 style="font-size:24px">Add a collection or project</h2><label>Title</label><input id="n_t"><label>Type (example: Collection, Sketchbook, Project work)</label><input id="n_c" value="Collection"><label>Description</label><textarea id="n_d" style="min-height:80px"></textarea><label>Tags (separate with commas, optional)</label><input id="n_g" placeholder="Indo-western, Sustainable"><label>Photos (select many, each up to 5 MB)</label><input id="n_f" type="file" multiple accept="image/*"><div class="row"><button class="b p" onclick="addItem()">Upload &amp; add</button><span class="msg" id="st">${esc(msg)}</span></div></div><div class="panel">${items.length?items.map(i=>`<div class="it">${i.images?.[0]?`<img src="/api/file/${i.images[0].id}" alt="">`:'<div class="ph"></div>'}<b>${esc(i.title)}<br><small class="hint">${(i.images||[]).length} photo(s)</small></b><label class="b sm" style="margin:0;text-transform:none;letter-spacing:0">+ Photos<input type="file" multiple accept="image/*" hidden onchange="moreImgs('${i.id}',this)"></label><button class="b sm" onclick="rename('${i.id}')">Rename</button><button class="b sm" onclick="delItem('${i.id}')">Delete</button></div>`).join(''):'<p class="hint">No collections yet. Add your first one above.</p>'}</div>`;
 $('#app').innerHTML=`<div class="w"><h1>ADMIN</h1><div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';msg='';view()">${t[1]}</button>`).join('')}</div>${b}<p class="hint" style="text-align:center"><a href="/" target="_blank">View website</a> · <a href="#" onclick="tok='';sessionStorage.removeItem('t');view();return false">Log out</a></p></div>`}
async function login(){try{const r=await api('login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:$('#id').value.trim(),pass:$('#pw').value})});tok=r.token;sessionStorage.setItem('t',tok);msg='';await load();view()}catch(e){msg=e.message;view()}}
async function prep(f){if(!f.type.startsWith('image/')||f.type==='image/svg+xml')return f;const bm=await createImageBitmap(f),k=Math.min(1,1800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.88))}
async function up(files){const out=[];let n=0;for(const f of files){n++;set(`Uploading ${n}/${files.length}…`);const b=await prep(f);if(b.size>5.5e6)throw new Error(f.name+' is bigger than 5.5 MB');const type=b.type||f.type||'application/octet-stream',r=await api('upload?type='+encodeURIComponent(type),{method:'POST',body:b});out.push({id:r.id,name:f.name,type})}return out}
function read(keys){keys.forEach(k=>{C[k]=$('#f_'+k).value})}
async function saveProfile(){try{read(['role','location','intro','about','skills','email','instagram','linkedin','whatsapp']);const p=$('#portrait').files,r=$('#resume').files;if(p.length)C.portraitId=(await up([p[0]]))[0].id;if(r.length)C.resumeId=(await up([r[0]]))[0].id;await save();msg='Saved ✓ (live on your website)'}catch(e){msg='Failed: '+e.message}view()}
async function saveMore(){try{read(['education','services']);await save();msg='Saved ✓ (live on your website)'}catch(e){msg='Failed: '+e.message}view()}
async function addItem(){const t=$('#n_t').value.trim();if(!t)return set('Please add a title');try{const images=await up([...$('#n_f').files]);items.push({id:'i'+Date.now(),title:t,category:$('#n_c').value.trim()||'Collection',description:$('#n_d').value,tags:$('#n_g').value,images,ts:Date.now()});await save();msg='Added ✓ (live on your website)'}catch(e){msg='Failed: '+e.message}view()}
async function moreImgs(id,el){const i=items.find(x=>x.id===id);try{i.images=[...(i.images||[]),...await up([...el.files])];await save();msg='Photos added ✓'}catch(e){msg='Failed: '+e.message}view()}
async function rename(id){const i=items.find(x=>x.id===id),t=prompt('New title',i.title);if(t){i.title=t;await save();view()}}
async function delItem(id){if(!confirm('Delete this collection?'))return;const i=items.find(x=>x.id===id);items=items.filter(x=>x.id!==id);await save();for(const f of i.images||[])api('rmfile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:f.id})}).catch(()=>{});view()}
view();if(tok)load().then(view).catch(()=>{});
</script></body></html>
